name: Stage 3 Vue frontend

on:
  push:
    branches: ["stage3/**"]
  pull_request:
    branches: ["stage2/**"]

permissions:
  contents: write

concurrency:
  group: stage3-vue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PhotoSorter/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve exact dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist npm lockfile on stage3 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/stage3/vue-frontend'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(stage3): pin exact npm dependency graph"
            git push origin HEAD:stage3/vue-frontend
          fi
      - name: Install clean dependency graph
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and production build
        run: npm run build
      - name: Frontend unit tests
        run: npm run test
