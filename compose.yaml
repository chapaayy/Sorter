name: outdoor-sorter
x-app-env: &app_env
  DATABASE_URL: postgresql://sorter:${POSTGRES_PASSWORD:?Run install.sh first}@postgres:5432/sorter
  DOMAIN: ${DOMAIN:?Set DOMAIN}
  MAP_APP_STORAGE_ROOT: /storage/app
  MAP_LOG_ROOT: /logs
  PHOTOSORTER_FORCE_CPU: "1"
  PHOTOSORTER_MIN_FREE_BYTES: ${PHOTOSORTER_MIN_FREE_BYTES:-}
  PHOTOSORTER_WORKER_CPUS: "${PHOTOSORTER_WORKER_CPUS:-7}"
  PHOTOSORTER_WORKER_CPUSET: "${PHOTOSORTER_WORKER_CPUSET:-0-6}"
  PHOTOSORTER_CPU_THREADS: "${PHOTOSORTER_CPU_THREADS:-7}"
  PHOTOSORTER_BATCH_SIZE: "4"
  PHOTOSORTER_PREFETCH_WORKERS: "2"

x-app-data: &app_data
  - &app_storage_bind ${MAP_STORAGE_ROOT:-./storage}/app:/storage/app
  - ${MAP_STORAGE_ROOT:-./storage}/system/updater/control:/run/map-updater:ro

services:
  caddy:
    image: caddy:2-alpine
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    restart: unless-stopped
    # TCP congestion control is namespaced: force the same algorithm in Caddy.
    sysctls:
      net.ipv4.tcp_congestion_control: "${PHOTOSORTER_CADDY_TCP_CC:-cubic}"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      MAP_CADDY_ACCESS_ROLL: ${MAP_CADDY_ACCESS_ROLL:-20MiB}
      MAP_CADDY_RUNTIME_ROLL: ${MAP_CADDY_RUNTIME_ROLL:-6MiB}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./PhotoSorter/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MAP_STORAGE_ROOT:-./storage}/infrastructure/caddy/data:/data
      - ${MAP_STORAGE_ROOT:-./storage}/infrastructure/caddy/config:/config
      - ${MAP_STORAGE_ROOT:-./storage}/logs/caddy:/logs
    depends_on:
      api:
        condition: service_healthy
    networks: [public]

  api:
    image: map-local/app:current
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=32m,mode=1777
    logging: *bounded_logs
    build:
      context: .
      dockerfile: PhotoSorter/docker/app/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment:
      <<: *app_env
      MAP_SERVICE: api
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - *app_storage_bind
      - ${MAP_STORAGE_ROOT:-./storage}/system/updater/control:/run/map-updater:ro
      - ${MAP_STORAGE_ROOT:-./storage}/system/updater/rpc:/run/map-updater-rpc:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/api:/logs/api
      - ${MAP_STORAGE_ROOT:-./storage}/logs/models:/logs/models
      - ${MAP_STORAGE_ROOT:-./storage}/system/audits:/host-audit:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/audit:/logs/audit:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/processing:/logs/processing:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [public, private]

  worker:
    image: map-local/app:current
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=32m,mode=1777
    logging: *bounded_logs
    build:
      context: .
      dockerfile: PhotoSorter/docker/app/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "server.worker"]
    environment:
      <<: *app_env
      MAP_SERVICE: worker
    volumes:
      - *app_storage_bind
      - ${MAP_STORAGE_ROOT:-./storage}/system/updater/control:/run/map-updater:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/worker:/logs/worker
      - ${MAP_STORAGE_ROOT:-./storage}/logs/processing:/logs/processing
    depends_on:
      postgres:
        condition: service_healthy
    cpus: ${PHOTOSORTER_WORKER_CPUS:-7}
    cpuset: "${PHOTOSORTER_WORKER_CPUSET:-0-6}"
    mem_limit: 20g
    networks: [private]

  cleanup:
    image: map-local/app:current
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=32m,mode=1777
    logging: *bounded_logs
    build:
      context: .
      dockerfile: PhotoSorter/docker/app/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "server.workers.cleanup"]
    environment:
      <<: *app_env
      MAP_SERVICE: cleanup
    volumes:
      - *app_storage_bind
      - ${MAP_STORAGE_ROOT:-./storage}/system/updater/control:/run/map-updater:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/cleanup:/logs/cleanup
      - ${MAP_STORAGE_ROOT:-./storage}/logs/processing:/logs/processing
    depends_on:
      postgres:
        condition: service_healthy
    # CPU weight applies only during contention; no artificial throughput ceiling.
    cpu_shares: 64
    mem_limit: 256m
    networks: [private]

  thumbnail:
    image: map-local/app:current
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp:size=32m,mode=1777
    logging: *bounded_logs
    build:
      context: .
      dockerfile: PhotoSorter/docker/app/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "server.workers.thumbnail"]
    environment:
      <<: *app_env
      MAP_SERVICE: thumbnail
    volumes:
      - *app_storage_bind
      - ${MAP_STORAGE_ROOT:-./storage}/system/updater/control:/run/map-updater:ro
      - ${MAP_STORAGE_ROOT:-./storage}/logs/thumbnail:/logs/thumbnail
    depends_on:
      postgres:
        condition: service_healthy
    # Low priority; may use idle CPU capacity to accelerate thumbnail generation.
    cpu_shares: 128
    mem_limit: 512m
    networks: [private]

  postgres:
    logging: *bounded_logs
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sorter
      POSTGRES_USER: sorter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    volumes:
      - ${MAP_STORAGE_ROOT:-./storage}/infrastructure/postgres/data:/var/lib/postgresql/data
      - ${MAP_STORAGE_ROOT:-./storage}/logs/postgres:/logs
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=/logs", "-c", "log_filename=postgresql-%Y%m%d-%H%M%S.log", "-c", "log_rotation_age=60", "-c", "log_rotation_size=10MB", "-c", "log_statement=none", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorter -d sorter"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]

networks:
  public:
  private:
    internal: true
